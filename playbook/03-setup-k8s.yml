---
- name: Instalar componentes essenciais do Kubernetes
  hosts: kubernetes
  become: yes
  tasks:

    - name: Garantir que o diretório de keyrings do apt existe
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Fazer o download da chave GPG pública do repositório Kubernetes
      shell: "curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg"
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Adicionar o repositório do Kubernetes
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /'

    - name: Atualizar o cache do apt e instalar kubelet, kubeadm e kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Travar as versões dos pacotes
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Baixar o script oficial de instalação do Helm
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0700'

    - name: Executar o script de instalação do Helm
      command: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm