---
- name: Expor Envoy Gateway na porta 80 (OCI bare metal)
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: Obter NodePort HTTP do Envoy Gateway
      command: >
        kubectl get svc -n envoy-gateway-system
        -l gateway.envoyproxy.io/owning-gateway-name=public-gateway
        -o jsonpath={.items[0].spec.ports[?(@.port==80)].nodePort}
      register: envoy_nodeport
      changed_when: false
      failed_when: envoy_nodeport.stdout | length == 0

    - name: Remover regra antiga de redirecionamento (se existir)
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        comment: oci-envoy-gateway-http
        jump: REDIRECT
        state: absent
      failed_when: false

    - name: Redirecionar trafego da porta 80 para NodePort do Envoy (PREROUTING)
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        protocol: tcp
        destination: "{{ ansible_default_ipv4.address }}"
        destination_port: "80"
        jump: REDIRECT
        to_ports: "{{ envoy_nodeport.stdout }}"
        comment: oci-envoy-gateway-http
        action: insert
        rule_num: 1

    - name: Remover regra antiga de INPUT na NodePort (se existir)
      ansible.builtin.iptables:
        chain: INPUT
        comment: oci-envoy-gateway-nodeport
        jump: ACCEPT
        state: absent
      failed_when: false

    - name: Permitir trafego externo na NodePort do Envoy (filter INPUT)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ envoy_nodeport.stdout }}"
        jump: ACCEPT
        comment: oci-envoy-gateway-nodeport
        action: insert
        rule_num: 1

    - name: Evitar prompt do iptables-persistent
      debconf:
        name: iptables-persistent
        question: iptables-persistent/autosave_v4
        value: "true"
        vtype: boolean

    - name: Evitar prompt do iptables-persistent (IPv6)
      debconf:
        name: iptables-persistent
        question: iptables-persistent/autosave_v6
        value: "true"
        vtype: boolean

    - name: Instalar iptables-persistent
      apt:
        name: iptables-persistent
        state: present
        update_cache: yes

    - name: Persistir regras iptables
      command: netfilter-persistent save
      changed_when: true

    - name: Exibir URL de acesso ao preview
      debug:
        msg: >-
          Preview externo (exemplo MR 1):
          http://pr-1.{{ ansible_host | replace('.', '-') }}.nip.io:{{ envoy_nodeport.stdout }}/
