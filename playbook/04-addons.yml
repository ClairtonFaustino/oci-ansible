---
- name: Instalar Addons Essenciais do Kubernetes
  hosts: master
  become: no
  tasks:

    - name: 1. Instalar CNI (Calico)
      command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/calico.yaml

    - name: 2. Baixar manifesto do Metrics Server
      get_url:
        url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        dest: /tmp/metrics-server.yaml

    - name: 2.1 Configurar TLS Inseguro no Metrics Server
      replace:
        path: /tmp/metrics-server.yaml
        regexp: '(- --secure-port=4443)'
        replace: '\1\n        - --kubelet-insecure-tls'

    - name: 2.2 Aplicar Metrics Server
      command: kubectl apply -f /tmp/metrics-server.yaml

    - name: 3. Instalar os CRDs da Gateway API
      command: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml

    - name: 4. Instalar o Envoy Gateway
      shell: |
        helm repo add envoy https://envoyproxy.github.io/gateway/helm
        helm repo update
        helm install eg envoy/gateway -n envoy-gateway-system --create-namespace
      args:
        executable: /bin/bash