---
- name: Instalar e configurar o Container Runtime (containerd)
  hosts: kubernetes
  become: yes
  tasks:

    - name: Instalar pacotes pré-requisitos
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Garantir que o diretório de keyrings do apt existe
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixar a chave GPG oficial do Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Adicionar o repositório do Docker
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

    - name: Atualizar o cache do apt e instalar o containerd
      apt:
        name: containerd.io
        state: present
        update_cache: yes

    - name: Criar o diretório de configuração do containerd
      file:
        path: /etc/containerd
        state: directory

    - name: Gerar a configuração padrão do containerd
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configurar o SystemdCgroup como true no containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Reiniciar containerd

  handlers:
    - name: Reiniciar containerd
      service:
        name: containerd
        state: restarted
        enabled: yes