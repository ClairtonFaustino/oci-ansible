---
- name: Instalar e configurar o Container Runtime (containerd)
  hosts: kubernetes
  become: yes
  tasks:

    - name: Instalar pacotes pré-requisitos
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Adicionar a chave GPG oficial do Docker (que contém o containerd)
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Adicionar o repositório do Docker
      apt_repository:
        repo: "deb [arch=arm64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Instalar o containerd
      apt:
        name: containerd.io
        state: present
        update_cache: yes

    - name: Criar o diretório de configuração do containerd
      file:
        path: /etc/containerd
        state: directory

    - name: Gerar a configuração padrão do containerd
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configurar o SystemdCgroup como true no containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Reiniciar containerd

  handlers:
    - name: Reiniciar containerd
      service:
        name: containerd
        state: restarted
        enabled: yes